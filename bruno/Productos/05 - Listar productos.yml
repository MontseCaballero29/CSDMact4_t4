info:
  name: 05 - Listar productos
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/productos?page=0&size=5&sort=id,asc"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "5"
      type: query
    - name: sort
      value: id,asc
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
