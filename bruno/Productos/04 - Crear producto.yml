info:
  name: 04 - Crear producto
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/productos"
  body:
    type: json
    data: |-
      {
        "nombre": "Galleta de chocolate",
        "descripcion": "Galleta de chocolate con decoración de chispas",
        "precio": 450.00,
        "stock": 15,
        "categoriaId": 1
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("productoId", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
