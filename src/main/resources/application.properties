spring.application.name=CSDMact4_t4

server.port=8088

# Conexión con MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dulce_luna_api_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City}
spring.datasource.username=${DB_USER:pasteleria_user}
spring.datasource.password=${pass}

# Configuración de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Errores
server.error.include-message=always

# Configuración JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600